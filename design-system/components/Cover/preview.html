<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CareBridge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,72,400&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--canvas); color:var(--ink); font-family:var(--font-mono); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .deep { fill:var(--blue-deep); }
  .blue { fill:var(--blue); }
  .soft { fill:var(--blue-soft); }
  .ink { fill:var(--ink); }
  .ring { fill:none; stroke:var(--canvas); stroke-width:2; }
  .ring-blue { fill:none; stroke:var(--blue-soft); stroke-width:2; }
  .tick { stroke:var(--canvas); stroke-width:2; stroke-linecap:round; }
  .thread { fill:none; stroke:var(--blue-soft); stroke-width:1.5; }
  .knot { fill:var(--blue-soft); }
  .words { position:absolute; left:32px; bottom:32px; max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-style:italic; font-weight:400; font-size:80px; line-height:.95; letter-spacing:-.01em; color:var(--ink); }
  .tag { margin:12px 0 0 4px; font-size:14px; line-height:20px; color:var(--ink); opacity:.72; font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      blue-deep 176×264 slab bled off the top (the inked panel) · blue 120 disc (the stamp, the identity) · blue-soft 120×80 (secondary fill) · ink 160×200 bleeding off the right — ≈36% of 960×288
  arrangement one tall inked slab with satellites, bottoms aligned 48px above the edge, 16px gutters
  pattern     stamps + one thread (the brief's two signature primitives): rotated rings with a tick cut into the slab in canvas, one ring on the ink block in blue-soft, and a single hairline thread from the stamp to the ink block
  scales      no spacing or radius tokens in the source yet: 16px gutters and square blocks; stamps are full circles as the brief describes
-->
<rect class="deep" x="16" y="-24" width="176" height="264"/>
<circle class="ring" cx="66" cy="176" r="26"/>
<circle class="ring" cx="66" cy="176" r="19"/>
<line class="tick" x1="56" y1="170" x2="76" y2="182"/>
<circle class="ring" cx="138" cy="108" r="20"/>
<line class="tick" x1="130" y1="114" x2="146" y2="102"/>
<rect class="soft" x="208" y="24" width="120" height="80"/>
<circle class="blue" cx="268" cy="180" r="60"/>
<circle class="ring" cx="268" cy="180" r="44"/>
<rect class="ink" x="344" y="40" width="160" height="200"/>
<circle class="ring-blue" cx="400" cy="104" r="20"/>
<path class="thread" d="M312 150 C 340 120, 360 108, 380 104"/>
<circle class="knot" cx="312" cy="150" r="3"/>
</svg>
</div>
<div class="words">
<h1 class="name">CareBridge</h1>
<p class="tag">The outpatient report, turned into a week of care.</p>
</div>
</div>
</body>
</html>
